<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>초평 택틱스 - 사라진 소수점</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: linear-gradient(180deg, #1a1a4a, #3a2a6a); color: #fff; font-family: 'Galmuri11', sans-serif; padding: 16px; }
  .box { width: 100%; max-width: 640px; text-align: center; }
  h1 { font-size: 34px; margin: 6px 0; color: #ffe27a; text-shadow: 3px 3px 0 #1a1020; }
  .sub { color: #c8d8ff; margin-bottom: 24px; }
  a.card { display: block; margin: 14px 0; padding: 20px 16px; border-radius: 10px; text-decoration: none; color: #fff;
           border: 3px solid #1a1020; box-shadow: 0 5px 0 #1a1020; }
  a.card:active { transform: translateY(3px); box-shadow: 0 2px 0 #1a1020; }
  .c1 { background: linear-gradient(180deg, #3a8ad0, #2a5aa0); }
  .c2 { background: linear-gradient(180deg, #e0903a, #b0601a); }
  .t { font-size: 22px; margin-bottom: 6px; }
  .d { font-size: 14px; opacity: .9; line-height: 1.5; }
  .note { margin-top: 22px; font-size: 13px; color: #b8c0e0; line-height: 1.6; }
</style>
</head>
<body>
  <div class="box">
    <div class="sub">초평면을 지켜라!</div>
    <h1>초평 택틱스</h1>
    <div class="sub">― 사라진 소수점 ―</div>
    <a class="card c1" href="tactics1/index.html">
      <div class="t">⚔ 1편 · 소수의 덧셈과 뺄셈</div>
      <div class="d">4학년 2학기 · 보스 10명과 대마왕 동진을 물리쳐요!</div>
    </a>
    <a class="card c2" href="tactics2/index.html">
      <div class="t">✖ 2편 · 소수의 곱셈</div>
      <div class="d">5학년 2학기 4단원 · 암산으로 푸는 소수의 곱셈</div>
    </a>
    <div class="note">💾 게임 기록은 지금 쓰는 기기의 브라우저에 저장돼요.<br>같은 기기, 같은 브라우저에서 이어서 할 수 있어요.</div>
  </div>
</body>
</html>
